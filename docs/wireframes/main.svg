  <!-- footer -->
  <rect x="20" y="790" width="760" height="90" fill="#fafafa" stroke="#ddd"/>
  <text x="44" y="826" font-size="14" font-weight="bold" fill="#555">못난이마켓</text>
  <text x="44" y="850" font-size="12" fill="#888">버려지는 농산물을 줄이는 가치소비 쇼핑몰 · © 2026 Team 못난이</text>
  <text x="776" y="806" font-size="11" text-anchor="end" fill="#2563eb">⑤ Footer</text>
