    <text x="56" y="696" font-size="14" fill="#333">못난이 당근 1kg</text>
    <text x="56" y="722" font-size="14" font-weight="bold" fill="#333">40% 2,900원</text>
    <text x="56" y="742" font-size="11" fill="#999" text-decoration="line-through">4,800원</text>
