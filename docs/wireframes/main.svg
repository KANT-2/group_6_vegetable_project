    <text x="420" y="696" font-size="14" fill="#333">B급 표고버섯 500g</text>
    <text x="420" y="722" font-size="14" font-weight="bold" fill="#333">30% 6,900원</text>
    <text x="420" y="742" font-size="11" fill="#999" text-decoration="line-through">9,900원</text>
  </g>
  <g>
    <rect x="590" y="484" width="166" height="270" rx="8" fill="#fff" stroke="#999"/>
    <rect x="590" y="484" width="166" height="166" rx="8" fill="#eee" stroke="#999"/><use href="#x" transform="translate(590 484) scale(166 166)"/>
    <rect x="618" y="556" width="110" height="22" rx="4" fill="#fff" stroke="#999"/><text x="673" y="571" font-size="12" text-anchor="middle" fill="#666">cabbage.jpg</text>
    <text x="602" y="674" font-size="11" fill="#777">크기가 작아요</text>
    <text x="602" y="696" font-size="14" fill="#333">꼬마 양배추 1통</text>
    <text x="602" y="722" font-size="14" font-weight="bold" fill="#333">45% 1,900원</text>
    <text x="602" y="742" font-size="11" fill="#999" text-decoration="line-through">3,500원</text>
