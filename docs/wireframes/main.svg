<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <g id="x"><line x1="0" y1="0" x2="1" y2="1" stroke="#b0b0b0" vector-effect="non-scaling-stroke"/><line x1="1" y1="0" x2="0" y2="1" stroke="#b0b0b0" vector-effect="non-scaling-stroke"/></g>
  </defs>
  <rect width="800" height="900" fill="#ffffff"/>

  <!-- browser frame -->
  <rect x="20" y="20" width="760" height="860" rx="12" fill="#fff" stroke="#888"/>
  <rect x="20" y="20" width="760" height="36" rx="12" fill="#f2f2f2" stroke="#888"/>
  <circle cx="42" cy="38" r="5" fill="#ccc"/><circle cx="58" cy="38" r="5" fill="#ccc"/><circle cx="74" cy="38" r="5" fill="#ccc"/>
  <rect x="96" y="28" width="300" height="20" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="106" y="42" font-size="12" fill="#888">localhost:3000</text>

