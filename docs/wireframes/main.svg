  <text x="152" y="278" font-size="13" text-anchor="middle" fill="#fff">지금 둘러보기</text>
  <text x="756" y="126" font-size="11" text-anchor="end" fill="#2563eb">② 히어로 배너 (클릭 시 /products)</text>

  <!-- categories -->
  <g font-size="13" fill="#555">
    <rect x="44" y="396" width="60" height="30" rx="15" fill="#fff" stroke="#999"/><text x="74" y="416" text-anchor="middle">전체</text>
    <rect x="114" y="396" width="84" height="30" rx="15" fill="#fff" stroke="#999"/><text x="156" y="416" text-anchor="middle">뿌리채소</text>
    <rect x="208" y="396" width="72" height="30" rx="15" fill="#fff" stroke="#999"/><text x="244" y="416" text-anchor="middle">잎채소</text>
    <rect x="290" y="396" width="60" height="30" rx="15" fill="#fff" stroke="#999"/><text x="320" y="416" text-anchor="middle">과일</text>
    <rect x="360" y="396" width="60" height="30" rx="15" fill="#fff" stroke="#999"/><text x="390" y="416" text-anchor="middle">버섯</text>
  </g>
  <text x="756" y="416" font-size="11" text-anchor="end" fill="#2563eb">③ 카테고리 (선택 구현)</text>

